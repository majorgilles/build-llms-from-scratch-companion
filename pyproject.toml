[project]
name = "build-llms-from-scratch-companion"
version = "0.1.0"
description = "Private follow-along workspace for Build a Large Language Model (From Scratch)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.4",
]

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
